[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextdb-cloud-client"
version = "0.1.0a1"
description = "Remote client for the ContextDB Cloud data plane (hosted alpha)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Atoms AI", email = "gaurav@saaslabs.co" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["contextdb_cloud_client"]

[project.urls]
Homepage = "https://github.com/atomsai/contextdb-clients"
Repository = "https://github.com/atomsai/contextdb-clients"
Documentation = "https://contextdb.ai/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
